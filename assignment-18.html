<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABC College Admission 2026</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      header,
      footer {
        background: darkblue;
        color: white;
        text-align: center;
        padding: 16px;
        max-width: 800px;
        margin: auto;
      }
      main {
        max-width: 650px;
        margin: 20px auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      caption {
        margin: 8px;
      }
      th,
      td {
        border: 1px solid gray;
        padding: 8px;
        text-align: left;
      }
      th {
        background: darkgray;
      }
      fieldset {
        margin-top: 16px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
      }
      input,
      select,
      textarea {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <header><h1>ABC College Admission 2026</h1></header>
    <main>
      <section aria-labelledby="fees-heading">
        <h2 id="fees-heading">Courses and Fees</h2>
        <table>
          <caption>
            Available Courses
          </caption>
          <thead>
            <tr>
              <th scope="col">Course</th>
              <th scope="col">Seats</th>
              <th scope="col">Fees</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>B.Tech CSE</td>
              <td>120</td>
              <td>₹90,000</td>
            </tr>
            <tr>
              <td>BCA</td>
              <td>60</td>
              <td>₹45,000</td>
            </tr>
          </tbody>
        </table>
      </section>
      <form action="#" method="post">
        <fieldset>
          <legend>Application Form</legend>
          <label for="student-name">Name:</label>
          <input id="student-name" name="name" type="text" required />
          <label for="student-email">Email:</label>
          <input id="student-email" name="email" type="email" required />
          <label for="student-course">Course:</label>
          <select id="student-course" name="course">
            <option>B.Tech CSE</option>
            <option>BCA</option>
          </select>
          <label for="statement">Statement:</label>
          <textarea
            id="statement"
            name="statement"
            rows="5"
            cols="40"
          ></textarea>
          <p><button type="submit">Apply</button></p>
        </fieldset>
      </form>
    </main>
    <footer>&copy; 2026 ABC College</footer>
  </body>
</html>
